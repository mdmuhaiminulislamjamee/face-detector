name: face_detector
description: "A Flutter camera app for real-time face detection and tracking."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  google_mlkit_face_detection: ^0.14.0
  camera: ^0.12.0+2
  permission_handler: ^12.0.3
  dartcv4: 2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  camera_platform_interface: ^2.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon_1024.png
    - assets/models/face_detection_yunet_2023mar.onnx
    - assets/models/YUNET_LICENSE

hooks:
  user_defines:
    dartcv4:
      parallel_jobs: 4
      include_modules:
        - imgcodecs
        - imgproc
        - objdetect
        - dnn
      ios:
        deployment_target: '15.5'
